name: Sprachplaner Desktop
on:
  push:
    paths: ['sprachplaner/**', '.github/workflows/sprachplaner-desktop.yml']
  pull_request:
    paths: ['sprachplaner/**', '.github/workflows/sprachplaner-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sprachplaner/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sprachplaner/desktop/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run prepare:web
      - run: npm run test:runtime
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and verify Windows app
        shell: pwsh
        run: |
          $installer = Get-Item release/Sprachplaner-Setup-*.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'Sprachplaner-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          node tests/installed.cjs (Join-Path $installDir 'Sprachplaner.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed app verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Sprachplaner-Windows-Setup
          path: sprachplaner/desktop/release/Sprachplaner-Setup-*.exe
          if-no-files-found: error
